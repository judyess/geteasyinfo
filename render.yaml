# Render "Blueprint" -- lets you create all three pieces (backend, frontend,
# database) at once via Render's dashboard: New -> Blueprint -> select this repo.
# You can also skip this file entirely and create each service manually
# through the dashboard, following the README instead.
databases:
  - name: todo-db
    plan: free

services:
  - type: web
    name: todo-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: todo-db
          property: connectionString
      - key: FRONTEND_URL
        sync: false   # set this manually once you know your frontend's URL/domain

  - type: web
    name: todo-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false   # set this manually to your backend's URL once deployed
